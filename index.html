<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <h3>Currency Converter</h4>
            <div class="container">
                <form action="">
                    <div id="text">Enter Amount</div>
                    <input type="text" id="enteramt">
                    <div class="dropdown">
                        <div class="left">
                            <p>FROM</p>
                            <div class="select-container" >
                                 <img src="https://countryflagsapi.netlify.app/flag/IN.svg">
                                <select name="From" id="from">
                                    <!-- <option value="INR">INR</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="JPY">JPY</option> -->
                                </select>
                            </div>
                        </div>
                        <i class="fa-solid fa-arrow-right-arrow-left" id="icon"></i>
                        <div class="left">
                            <p>TO</p>
                            <div class="select-container">
                               <img src="https://countryflagsapi.netlify.app/flag/US.svg">

                                <select name="To" id="to">
                                    <!-- <option value="INR">INR</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="JPY">JPY</option> -->
                                </select>
                            </div>
                        </div>
                    </div>
                    <p id="msg">80 INR = 1 USD</p>
                    <button id="btn">Get Exchange Rate</button>
                </form>
            </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
